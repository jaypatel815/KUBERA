<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>KUBERA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #07070c; color: #e8e4d8; overflow: hidden;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif; }

  /* ── layout shell ── */
  #shell { position: fixed; inset: 0; display: flex; flex-direction: row; }

  /* ── sidebar (left) ── */
  #sidebar { width: 0; overflow: hidden; transition: width 0.22s ease;
    display: flex; flex-direction: column; background: #0d0d14;
    border-right: 1px solid #1a1a24; flex-shrink: 0; }
  #sidebar.open { width: 240px; }
  #sidebar-hdr { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 12px 10px; border-bottom: 1px solid #1a1a24; flex-shrink: 0; }
  #sidebar-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a815f; }
  #btn-new { font-size: 11px; color: #c9a227; cursor: pointer; letter-spacing: 1px;
    background: none; border: none; padding: 2px 6px; border-radius: 4px; }
  #btn-new:hover { background: #1a1a0a; }
  #sidebar-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  #sidebar-list::-webkit-scrollbar { width: 3px; }
  #sidebar-list::-webkit-scrollbar-thumb { background: #2a2520; border-radius: 3px; }
  .srow { padding: 9px 12px; cursor: pointer; border-left: 3px solid transparent;
    transition: background 0.12s; }
  .srow:hover { background: #12121a; }
  .srow.active { border-left-color: #c9a227; background: #111108; }
  .srow-snip { font-size: 12px; color: #c8c4b4; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
  .srow-meta { font-size: 10px; color: #55503e; margin-top: 3px; letter-spacing: 0.4px; }

  /* ── center stage ── */
  #center { flex: 1; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-width: 0; }
  #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #orb { cursor: pointer; }
  #status { margin-top: 6px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: #8a815f; user-select: none; }
  #hint { position: absolute; top: 18px; width: 100%; text-align: center; font-size: 12px;
    color: #55503e; letter-spacing: 1px; pointer-events: none; transition: color 0.3s; }
  #log { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
    width: min(640px, 90%); max-height: 30vh; overflow-y: auto; font-size: 14px;
    line-height: 1.55; -webkit-mask-image: linear-gradient(transparent, black 18%);
    mask-image: linear-gradient(transparent, black 18%); }
  .turn { margin: 10px 0; }
  .you { color: #6f9f9b; }
  .kub { color: #d9c98a; }
  .chips { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 5px; }
  /* base chip */
  .chip { display: inline-block; font-size: 10.5px; letter-spacing: 1px; color: #7d7457;
    border: 1px solid #2e2b20; border-radius: 999px; padding: 1px 9px; }
  /* freshness chip variants (T036b / T082) */
  .chip-live  { border-color: #2a5c48; color: #5aaa88; }
  .chip-last  { border-color: #4a4030; color: #9d8a60; }
  .chip-stale { border-color: #6a3820; color: #b07050; }
  .chip-old   { border-color: #5a2020; color: #9a5050; }

  #bar { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(640px, 90%); display: flex; gap: 8px; align-items: center; }
  #typed { flex: 1; background: #101018; border: 1px solid #23232e; border-radius: 10px;
    color: #e8e4d8; padding: 11px 14px; font-size: 14px; outline: none; }
  #typed:focus { border-color: #4a4433; }
  label.cf { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8a815f;
    user-select: none; white-space: nowrap; }
  input[type=checkbox] { accent-color: #c9a227; }
  #err { position: absolute; bottom: 4px; width: 100%; text-align: center; font-size: 11px;
    color: #a05c5c; }

  /* ── portfolio panel (right) ── */
  #port-panel { width: 0; overflow: hidden; transition: width 0.22s ease;
    display: flex; flex-direction: column; background: #0d0d14;
    border-left: 1px solid #1a1a24; flex-shrink: 0; }
  #port-panel.open { width: 264px; } /* widened for the monitor's days lens (T087) */
  #port-hdr { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 12px 10px; border-bottom: 1px solid #1a1a24; flex-shrink: 0; }
  #port-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a815f; }
  #port-body { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
  #port-body::-webkit-scrollbar { width: 3px; }
  #port-body::-webkit-scrollbar-thumb { background: #2a2520; border-radius: 3px; }
  .pl  { color: #8a815f; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    margin-top: 10px; margin-bottom: 2px; }
  .pv  { color: #c8c4b4; }
  .pv.pos { color: #5aaa88; }
  .pv.neg { color: #b07070; }
  .ppr { display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0; border-bottom: 1px solid #14141c; }
  .ppr-sym { color: #c8c4b4; font-size: 11px; font-weight: 600; }
  .ppr-pl { font-size: 10.5px; }
  #port-asof { font-size: 10px; color: #3a3830; margin-top: 10px; }

  /* ── open-trade monitor block (T087) — same judgment as scripts/monitor.py ── */
  .mon-row  { padding: 6px 0; border-bottom: 1px solid #14141c; }
  .mon-sym  { color: #c8c4b4; font-size: 11px; font-weight: 600; }
  .mon-days { color: #c9a227; font-size: 10.5px; line-height: 1.45; margin: 2px 0; }
  .mon-line { color: #8a815f; font-size: 10px; line-height: 1.45; }
  .mon-alert { color: #b07070; font-size: 10.5px; }
  .mon-watch { color: #a89050; font-size: 10.5px; }
  .mon-quiet { color: #5aaa88; font-size: 10px; }
  #mon-foot { font-size: 9.5px; color: #3a3830; margin-top: 8px; line-height: 1.5; }

  /* ── alert-notification bell (T147) ── */
  #btn-notify { background: none; border: none; cursor: pointer; float: right;
    font-size: 13px; opacity: 0.55; padding: 0 2px; }
  #btn-notify.on { opacity: 1; }

  /* ── performance vs SPY block (T143) — /api/benchmark drawn inline ── */
  #bench-chart { display: block; width: 100%; margin: 4px 0 2px; }
  .bench-you { color: #c9a227; }
  .bench-spy { color: #8b8fa3; }
  #bench-foot { font-size: 10px; line-height: 1.5; }

  /* ── floating toggle buttons ── */
  #btn-sidebar, #btn-port {
    position: fixed; top: 18px; z-index: 200;
    background: #0d0d14; border: 1px solid #1a1a24; border-radius: 6px;
    color: #8a815f; font-size: 14px; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: color 0.15s, border-color 0.15s; }
  #btn-sidebar { left: 12px; }
  #btn-port    { right: 12px; }
  #btn-sidebar:hover, #btn-port:hover { color: #c9a227; border-color: #4a4030; }
</style>
</head>
<body>

<!-- floating toggles -->
<button id="btn-sidebar" title="Conversation history">☰</button>
<button id="btn-port"    title="Portfolio snapshot">▣</button>

<div id="shell">

  <!-- ════ LEFT: conversation history sidebar (T082) ════ -->
  <div id="sidebar">
    <div id="sidebar-hdr">
      <span id="sidebar-title">History</span>
      <button id="btn-new" title="Start a new conversation">+ new</button>
    </div>
    <div id="sidebar-list"></div>
  </div>

  <!-- ════ CENTER: orb + chat ════ -->
  <div id="center">
    <div id="hint">click the orb or hold SPACE to talk &nbsp;·&nbsp; type below if you must</div>
    <div id="stage">
      <canvas id="orb" width="520" height="520"></canvas>
      <div id="status">idle</div>
    </div>
    <div id="log"></div>
    <div id="bar">
      <input id="typed" placeholder="…or type to KUBERA" autocomplete="off">
      <label class="cf"><input type="checkbox" id="confirm"> confirm this turn</label>
    </div>
    <div id="err"></div>
  </div>

  <!-- ════ RIGHT: portfolio snapshot panel (T082) ════ -->
  <div id="port-panel">
    <div id="port-hdr">
      <span id="port-title">Portfolio</span>
      <button id="btn-notify" title="alert notifications OFF">&#x1F515;</button>
    </div>
    <div id="port-body">
      <div class="pl">Equity</div>
      <div class="pv" id="port-equity">—</div>
      <div class="pl">Day P&amp;L</div>
      <div class="pv" id="port-daypnl">—</div>
      <div class="pl">Positions</div>
      <div id="port-positions"></div>
      <div id="port-asof"></div>
      <div class="pl">Open-trade monitor</div>
      <div id="mon-body"><div class="mon-line">loading&hellip;</div></div>
      <div id="mon-foot"></div>
      <div class="pl">Performance vs SPY (90d)</div>
      <canvas id="bench-chart" width="240" height="96"></canvas>
      <div id="bench-foot"><div class="mon-line">loading&hellip;</div></div>
    </div>
  </div>

</div><!-- #shell -->

<script>
// ------------------------------------------------------------------ state
const S = { mode: "idle", conversationId: null, amp: 0, t: 0 };
const COLORS = { idle: [201,162,39], listening: [78,168,160], thinking: [148,108,214],
                 speaking: [222,186,80] };
const statusEl = document.getElementById("status");
const errEl    = document.getElementById("err");
const hintEl   = document.getElementById("hint");
function setMode(m) { S.mode = m; statusEl.textContent = m; }

// ------------------------------------------------------------------ orb
const canvas = document.getElementById("orb"), ctx = canvas.getContext("2d");
const CX = 260, CY = 260;
function drawOrb() {
  S.t += 0.016;
  ctx.clearRect(0, 0, 520, 520);
  const [r, g, b] = COLORS[S.mode] || COLORS.idle;
  const breathe = 1 + 0.035 * Math.sin(S.t * (S.mode === "thinking" ? 4.2 : 1.6));
  const radius = (S.mode === "idle" ? 92 : 100) * breathe * (1 + S.amp * 0.55);
  // outer glow
  const glow = ctx.createRadialGradient(CX, CY, radius * 0.2, CX, CY, radius * 2.4);
  glow.addColorStop(0, `rgba(${r},${g},${b},0.55)`);
  glow.addColorStop(0.5, `rgba(${r},${g},${b},0.10)`);
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(CX, CY, radius * 2.4, 0, 7); ctx.fill();
  // wobbling core (soft blob: several offset circles)
  for (let i = 0; i < 3; i++) {
    const wob = Math.sin(S.t * 2.1 + i * 2.1) * 6 * (1 + S.amp * 2);
    const core = ctx.createRadialGradient(CX + wob, CY - wob, 4, CX, CY, radius);
    core.addColorStop(0, `rgba(${Math.min(r+55,255)},${Math.min(g+55,255)},${b+40},0.9)`);
    core.addColorStop(1, `rgba(${r},${g},${b},0.12)`);
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(CX, CY, radius - i * 7, 0, 7); ctx.fill();
  }
  S.amp *= 0.92; // decay toward calm
  requestAnimationFrame(drawOrb);
}
drawOrb();

// ------------------------------------------------------------------ log
const logEl = document.getElementById("log");

// T082: freshness heuristic for chips that fetch live prices.
// True verdict lives in the server payload; without forwarding it we infer from
// time-of-day: RTH 09:30–16:00 ET → live (teal), outside → last_session (gold).
const FRESHNESS_TOOLS = new Set(["get_latest", "get_symbol_briefing", "get_intraday"]);
function freshnessChipClass() {
  try {
    const et = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(new Date());
    const h = parseInt(et.find(p => p.type === "hour").value, 10);
    const m = parseInt(et.find(p => p.type === "minute").value, 10);
    const mins = h * 60 + m;
    if (mins >= 9 * 60 + 30 && mins < 16 * 60) return "chip-live";
    return "chip-last";
  } catch (_) { return "chip-last"; }
}

function addTurn(who, text, chips) {
  const div = document.createElement("div");
  div.className = "turn";
  const freshClass = freshnessChipClass();
  const chipsHtml = chips && chips.length
    ? `<div class="chips">${chips.map(c => {
        const extra = FRESHNESS_TOOLS.has(c) ? ` ${freshClass}` : "";
        return `<span class="chip${extra}">${c}</span>`;
      }).join("")}</div>`
    : "";
  div.innerHTML = `<span class="${who === "you" ? "you" : "kub"}">${
    who === "you" ? "you" : "kubera"}</span> — ${text.replace(/</g, "&lt;")}${chipsHtml}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// ------------------------------------------------------------------ speech in
// Patience (owner feedback 2026-08-14): a thinking pause is NOT the end of your
// sentence. The mic stays open across pauses; your words only send after
// SILENCE_SEND_MS of true quiet — or immediately when you click the orb again.
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const SILENCE_SEND_MS = 2800;
let rec = null, silenceTimer = null, finalBuf = "", lastInterim = "", wantListening = false;

function armSilenceTimer() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(finishListening, SILENCE_SEND_MS);
}
function finishListening() {
  clearTimeout(silenceTimer);
  wantListening = false;
  if (rec) { rec.onend = null; try { rec.stop(); } catch (_) {} }
  const text = (finalBuf + " " + lastInterim).trim();
  finalBuf = ""; lastInterim = "";
  if (text) send(text); else setMode("idle");
}
function startListening() {
  if (S.mode !== "idle") return;
  if (!Rec) { errEl.textContent = "Speech recognition needs Chrome or Edge — typing still works."; return; }
  rec = new Rec();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
  wantListening = true; finalBuf = ""; lastInterim = "";
  setMode("listening");
  statusEl.textContent = "listening — pauses are fine; click the orb to send now";
  rec.onresult = (e) => {
    S.amp = Math.min(1, S.amp + 0.25);
    lastInterim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalBuf += r[0].transcript + " ";
      else lastInterim = r[0].transcript;
    }
    armSilenceTimer();  // every sound resets the clock — send only on real quiet
    statusEl.textContent = "listening — " + (finalBuf + lastInterim).slice(-42);
  };
  rec.onerror = (e) => {
    if (e.error === "no-speech" || e.error === "aborted") return;  // quiet restarts are normal
    errEl.textContent = "mic: " + e.error; wantListening = false; setMode("idle");
  };
  rec.onend = () => {  // the engine restarts itself on silence — keep the mic open
    if (wantListening) { try { rec.start(); } catch (_) {} }
  };
  rec.start();
}
function stopListening() { if (S.mode === "listening") finishListening(); }

canvas.addEventListener("click", () =>
  S.mode === "listening" ? stopListening() : startListening());
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && document.activeElement !== typedEl) { e.preventDefault(); startListening(); }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space" && document.activeElement !== typedEl) { e.preventDefault(); stopListening(); }
});

// ------------------------------------------------------------------ chat + voice out
const typedEl   = document.getElementById("typed");
const confirmEl = document.getElementById("confirm");
typedEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && typedEl.value.trim()) { send(typedEl.value.trim()); typedEl.value = ""; }
});

let audioCtx = null, analyser = null;
function trackAmplitude(audio) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser); analyser.connect(audioCtx.destination);
    const data = new Uint8Array(analyser.frequencyBinCount);
    (function pump() {
      if (S.mode !== "speaking") return;
      analyser.getByteFrequencyData(data);
      S.amp = Math.min(1, data.reduce((a, v) => a + v, 0) / data.length / 90);
      requestAnimationFrame(pump);
    })();
  } catch (_) { /* amplitude is decoration; never break speech */ }
}

async function send(text) {
  errEl.textContent = "";
  addTurn("you", text);
  setMode("thinking");
  const confirm = confirmEl.checked;
  confirmEl.checked = false; // one deliberate turn at a time
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, conversation_id: S.conversationId,
                             voice: true, confirm })
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const body = await r.json();
    S.conversationId = body.conversation_id;
    addTurn("kubera", body.reply, (body.tool_calls || []).map(t => t.name));
    setMode("speaking");
    // T098: POST, not a query string. The reply names positions and dollar
    // amounts; a URL gets written into access logs and browser history.
    let audio = null;
    try {
      const speech = await fetch("/api/tts", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: body.reply.slice(0, 2000) })
      });
      if (!speech.ok) {
        const why = await speech.json().catch(() => ({}));
        throw new Error(why.detail || speech.statusText);
      }
      audio = new Audio(URL.createObjectURL(await speech.blob()));
      audio.onended = () => { URL.revokeObjectURL(audio.src); setMode("idle"); };
    } catch (voiceErr) {
      // Voice is a convenience; the reply is already on screen. Never lose the turn.
      errEl.textContent = "voice unavailable — reply shown above (" + (voiceErr.message || voiceErr) + ")";
      setMode("idle");
      loadConversations();
      return;
    }
    audio.onerror = () => {
      errEl.textContent = "voice playback failed — reply shown above";
      setMode("idle");
    };
    trackAmplitude(audio);
    await audio.play();
  } catch (e) {
    errEl.textContent = String(e.message || e);
    setMode("idle");
  }
  // Refresh sidebar so newly created threads appear immediately.
  loadConversations();
}

// ════════════════════════════════════════════════════════════════════
// T082 (a) — CONVERSATIONS SIDEBAR
// ════════════════════════════════════════════════════════════════════
const sidebarEl   = document.getElementById("sidebar");
const sidebarList = document.getElementById("sidebar-list");
const btnSidebar  = document.getElementById("btn-sidebar");

btnSidebar.addEventListener("click", () => {
  const opening = !sidebarEl.classList.contains("open");
  sidebarEl.classList.toggle("open");
  btnSidebar.title = opening ? "Close history" : "Conversation history";
  if (opening) loadConversations();
});

document.getElementById("btn-new").addEventListener("click", () => {
  S.conversationId = null;
  sidebarList.querySelectorAll(".srow.active").forEach(r => r.classList.remove("active"));
  flashHint("↩ new conversation — start talking");
});

function flashHint(msg, ms = 3200) {
  const orig = hintEl.textContent, origColor = hintEl.style.color;
  hintEl.textContent = msg;
  hintEl.style.color = "#9d8a60";
  setTimeout(() => { hintEl.textContent = orig; hintEl.style.color = origColor; }, ms);
}

function fmtAgo(isoStr) {
  const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
  if (diff < 60)    return "just now";
  if (diff < 3600)  return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

async function loadConversations() {
  try {
    const r = await fetch("/api/conversations?limit=50");
    if (!r.ok) return;
    const data = await r.json();
    const rows = data.conversations || [];
    sidebarList.innerHTML = "";
    if (rows.length === 0) {
      sidebarList.innerHTML =
        '<div style="padding:12px;font-size:11px;color:#3a3830;">' +
        'No conversations yet.<br>Start talking to KUBERA.</div>';
      return;
    }
    rows.forEach(conv => {
      const div = document.createElement("div");
      div.className = "srow" + (conv.id === S.conversationId ? " active" : "");
      div.dataset.id = String(conv.id);
      div.innerHTML =
        `<div class="srow-snip">${(conv.snippet || "(empty)").replace(/</g, "&lt;")}</div>` +
        `<div class="srow-meta">${fmtAgo(conv.last_activity_at)} &nbsp;·&nbsp; ` +
        `${conv.message_count} turns &nbsp;·&nbsp; ${conv.tool_calls} calls</div>`;
      div.addEventListener("click", () => resumeConversation(conv.id));
      sidebarList.appendChild(div);
    });
  } catch (_) {
    // Non-critical; server may be starting up — silent failure.
  }
}

function resumeConversation(id) {
  S.conversationId = id;
  sidebarList.querySelectorAll(".srow").forEach(r =>
    r.classList.toggle("active", parseInt(r.dataset.id, 10) === id));
  flashHint("↩ resumed conversation — ask your next question");
}

// ════════════════════════════════════════════════════════════════════
// T082 (b) — PORTFOLIO SNAPSHOT PANEL
// ════════════════════════════════════════════════════════════════════
const portPanel    = document.getElementById("port-panel");
const btnPort      = document.getElementById("btn-port");
const portEquityEl = document.getElementById("port-equity");
const portDayEl    = document.getElementById("port-daypnl");
const portPosEl    = document.getElementById("port-positions");
const portAsofEl   = document.getElementById("port-asof");

btnPort.addEventListener("click", () => {
  const opening = !portPanel.classList.contains("open");
  portPanel.classList.toggle("open");
  btnPort.title = opening ? "Close portfolio" : "Portfolio snapshot";
  if (opening) { loadPortfolio(); loadMonitor(); loadBench(true); }
});

function fmtUSD(n) {
  if (n == null || isNaN(n)) return "—";
  const abs = Math.abs(n).toLocaleString("en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? "-$" : "$") + abs;
}

async function loadPortfolio() {
  try {
    const r = await fetch("/portfolio");
    if (!r.ok) {
      portEquityEl.textContent = "broker offline";
      portEquityEl.className = "pv neg";
      portDayEl.textContent = "—";
      portDayEl.className = "pv";
      portPosEl.innerHTML = "";
      portAsofEl.textContent = "";
      return;
    }
    const d = await r.json();
    const acct = d.account || {};
    const equity    = parseFloat(acct.equity || 0);
    const lastEquity = parseFloat(acct.last_equity || equity);
    const dayPnl    = equity - lastEquity;

    portEquityEl.textContent = fmtUSD(equity);
    portEquityEl.className = "pv";

    portDayEl.textContent = (dayPnl >= 0 ? "+" : "") + fmtUSD(dayPnl);
    portDayEl.className = "pv " + (dayPnl >= 0 ? "pos" : "neg");

    const positions = (d.positions || [])
      .slice()
      .sort((a, b) => Math.abs(b.market_value || 0) - Math.abs(a.market_value || 0))
      .slice(0, 3);

    if (positions.length === 0) {
      portPosEl.innerHTML =
        '<div style="font-size:11px;color:#3a3830;padding:4px 0;">No open positions</div>';
    } else {
      portPosEl.innerHTML = positions.map(p => {
        const pl = parseFloat(p.unrealized_pl || 0);
        return `<div class="ppr">
          <span class="ppr-sym">${p.symbol}</span>
          <span class="ppr-pl ${pl >= 0 ? "pos" : "neg"}">${pl >= 0 ? "+" : ""}${fmtUSD(pl)}</span>
        </div>`;
      }).join("");
    }

    portAsofEl.textContent = "as of " + new Date(d.asof).toLocaleTimeString("en-US",
      { hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
  } catch (_) {
    portEquityEl.textContent = "unavailable";
    portEquityEl.className = "pv neg";
  }
}

// ════════════════════════════════════════════════════════════════════
// T087 — OPEN-TRADE MONITOR PANEL: renders GET /api/monitor, the exact
// same fetch-and-judge the owner's scripts/monitor.py runs (T087c —
// one implementation, two surfaces). Advisory only, in its own words.
// ════════════════════════════════════════════════════════════════════
const monBodyEl = document.getElementById("mon-body");
const monFootEl = document.getElementById("mon-foot");

function esc(s) { return String(s == null ? "" : s).replace(/</g, "&lt;"); }

async function loadMonitor() {
  try {
    const r = await fetch("/api/monitor");
    if (!r.ok) {
      let detail = r.status === 503 ? "not configured" : "broker/data unreachable";
      try { detail = (await r.json()).detail || detail; } catch (_) {}
      monBodyEl.innerHTML = `<div class="mon-line">${esc(detail).slice(0, 160)}</div>`;
      monFootEl.textContent = "";
      return;
    }
    const d = await r.json();
    if ((d.positions || []).length === 0) {
      monBodyEl.innerHTML =
        '<div class="mon-line">no open positions — nothing to monitor ' +
        "(that is an answer, not an error)</div>";
      monFootEl.textContent = "";
      return;
    }
    monBodyEl.innerHTML = d.positions.map(p => {
      const alerts = (p.alerts || []).map(a =>
        `<div class="${a.severity === "alert" ? "mon-alert" : "mon-watch"}">` +
        `${a.severity === "alert" ? "!!" : "~"} [${esc(a.kind)}] ${esc(a.detail)}</div>`).join("");
      const spots = (p.blind_spots || []).map(n =>
        `<div class="mon-line">. blind spot: ${esc(n)}</div>`).join("");
      const week = p.week_change_frac == null ? "?"
        : ((p.week_change_frac >= 0 ? "+" : "") + (p.week_change_frac * 100).toFixed(2) + "%");
      return `<div class="mon-row">
        <span class="mon-sym">${esc(p.symbol)}</span>
        <span class="mon-line"> qty ${esc(p.qty)} · week ${week}</span>
        <div class="mon-days">${esc(p.days_lens)}</div>
        <div class="mon-line">${esc(p.structure)}</div>
        ${p.context_note ? `<div class="mon-line">(${esc(p.context_note)})</div>` : ""}
        ${alerts}${spots}
        ${p.quiet ? '<div class="mon-quiet">. quiet — plan intact, volume normal</div>' : ""}
      </div>`;
    }).join("");
    const s = d.summary || {};
    monFootEl.textContent =
      `${s.positions} position(s): ${s.alerts} alert(s), ${s.watches} watch(es), ` +
      `${s.blind_spots} blind spot(s) · ${d.advisory || ""}` +
      (d.calendar_note ? ` · calendar degraded: ${d.calendar_note}` : "");
    // T147: only severity "alert" reaches the OS — watches stay in-panel
    const currentAlerts = [];
    d.positions.forEach(p => (p.alerts || []).forEach(a => {
      if (a.severity === "alert") {
        currentAlerts.push({ key: p.symbol + "|" + a.kind,
                             symbol: p.symbol, kind: a.kind,
                             detail: String(a.detail || "") });
      }
    }));
    notifyAlertTransitions(currentAlerts);
  } catch (_) {
    monBodyEl.innerHTML = '<div class="mon-line">monitor unavailable (server starting?)</div>';
  }
}

// ════════════════════════════════════════════════════════════════════
// T147 — LOCAL ALERT NOTIFICATIONS: the bell. When ON, a NEW monitor
// alert (per symbol+kind transition, tracked every poll so enabling
// never bursts the alerts already on screen) becomes an OS notification
// via the Notification API. Honest scope: this works only while KUBERA
// is open with the panel polling — there is NO push server, and a
// closed app stays silent (that gap is named in project memory, not
// papered over). Alerts only; watches stay in-panel.
// ════════════════════════════════════════════════════════════════════
const btnNotify = document.getElementById("btn-notify");
let notifyOn = false;
let seenAlertKeys = new Set();

function notifyAlertTransitions(current) {
  if (notifyOn && "Notification" in window &&
      Notification.permission === "granted") {
    current.forEach(c => {
      if (!seenAlertKeys.has(c.key)) {
        try {
          new Notification("KUBERA · " + c.symbol, {
            body: "[" + c.kind + "] " + c.detail.slice(0, 140),
            icon: "/icon.svg", tag: c.key });
        } catch (_) { /* notification failure never breaks the panel */ }
      }
    });
  }
  seenAlertKeys = new Set(current.map(c => c.key));
}

btnNotify.addEventListener("click", async () => {
  if (!("Notification" in window)) {
    btnNotify.title = "notifications not supported in this browser";
    return;
  }
  if (!notifyOn && Notification.permission !== "granted") {
    const p = await Notification.requestPermission(); // needs this user gesture
    if (p !== "granted") {
      btnNotify.title = "permission denied - re-enable in browser site settings";
      return;
    }
  }
  notifyOn = !notifyOn;
  btnNotify.textContent = notifyOn ? "🔔" : "🔕";
  btnNotify.classList.toggle("on", notifyOn);
  btnNotify.title = notifyOn
    ? "alert notifications ON - only while this panel is open (no push server)"
    : "alert notifications OFF";
});

// ════════════════════════════════════════════════════════════════════
// T143 — PERFORMANCE vs SPY: /api/benchmark (T021 compare + T060 math)
// drawn as two normalized curves, no chart library. Both start at 1.0 on
// the first common date; the gold line is you, the gray line is SPY, the
// dotted line is where you started. Excess return is the honest number.
// ════════════════════════════════════════════════════════════════════
const benchCvs = document.getElementById("bench-chart");
const benchFootEl = document.getElementById("bench-foot");
let benchLastMs = 0;
const BENCH_REFRESH_MS = 600_000; // daily-bar data — 10 min is generous

async function loadBench(force) {
  if (!force && Date.now() - benchLastMs < BENCH_REFRESH_MS) return;
  benchLastMs = Date.now();
  try {
    const r = await fetch("/api/benchmark?days=90");
    if (!r.ok) {
      let detail = "unavailable";
      try { detail = (await r.json()).detail || detail; } catch (_) {}
      benchCvs.style.display = "none";
      benchFootEl.innerHTML = `<div class="mon-line">${esc(detail).slice(0, 140)}</div>`;
      return;
    }
    const d = await r.json();
    const port = d.portfolio_norm || [], spy = d.benchmark_norm || [];
    if (port.length < 2 || port.length !== spy.length) {
      benchCvs.style.display = "none";
      benchFootEl.innerHTML = '<div class="mon-line">fewer than 2 aligned ' +
        "days of equity history — run scripts/sync.py daily</div>";
      return;
    }
    benchCvs.style.display = "block";
    drawBench(port, spy);
    const m = d.metrics || {}, pm = m.portfolio || {}, bm = m.benchmark || {};
    const pct = v => (v == null ? "?"
      : (v >= 0 ? "+" : "") + (v * 100).toFixed(2) + "%");
    benchFootEl.innerHTML =
      `<div class="mon-line"><span class="bench-you">you ${pct(pm.cumulative_return)}</span>` +
      ` &middot; <span class="bench-spy">SPY ${pct(bm.cumulative_return)}</span>` +
      ` &middot; excess ${pct(m.excess_return)}</div>` +
      `<div class="mon-line">${(d.dates || []).length} aligned days &middot; ` +
      `asof ${esc((d.asof || "").slice(0, 10))}</div>`;
  } catch (_) {
    benchFootEl.innerHTML =
      '<div class="mon-line">benchmark unavailable (server starting?)</div>';
  }
}

function drawBench(port, spy) {
  const ctx = benchCvs.getContext("2d");
  const W = benchCvs.width, H = benchCvs.height;
  ctx.clearRect(0, 0, W, H);
  const all = port.concat(spy);
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  if (hi - lo < 1e-9) { hi += 5e-10; lo -= 5e-10; } // flat week: still drawable
  const x = i => 2 + (i / (port.length - 1)) * (W - 4);
  const y = v => H - 4 - ((v - lo) / (hi - lo)) * (H - 8);
  if (lo <= 1.0 && 1.0 <= hi) { // the where-you-started line
    ctx.setLineDash([2, 3]); ctx.strokeStyle = "#4a4436"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(2, y(1.0)); ctx.lineTo(W - 2, y(1.0)); ctx.stroke();
    ctx.setLineDash([]);
  }
  const line = (arr, color, width) => {
    ctx.beginPath();
    arr.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  };
  line(spy, "#8b8fa3", 1);    // the benchmark: quiet gray
  line(port, "#c9a227", 1.6); // you: the orb's gold, drawn on top
}

// ── T136: PWA registration (feature-detected; failure is silent because
// the app works identically unregistered — the SW only caches the shell,
// NEVER money: see sw.js) ──
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

// ── init ──
loadConversations();
// Portfolio + monitor poll every 60 s while the panel is visible.
setInterval(() => {
  if (portPanel.classList.contains("open")) {
    loadPortfolio(); loadMonitor(); loadBench(false); // bench self-throttles to 10 min
  }
}, 60_000);
</script>
