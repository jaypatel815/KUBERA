<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KUBERA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #07070c; color: #e8e4d8; overflow: hidden;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  #orb { cursor: pointer; }
  #status { margin-top: 6px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: #8a815f; user-select: none; }
  #hint { position: fixed; top: 18px; width: 100%; text-align: center; font-size: 12px;
    color: #55503e; letter-spacing: 1px; }
  #log { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    width: min(680px, 92vw); max-height: 30vh; overflow-y: auto; font-size: 14px;
    line-height: 1.55; -webkit-mask-image: linear-gradient(transparent, black 18%);
    mask-image: linear-gradient(transparent, black 18%); }
  .turn { margin: 10px 0; }
  .you { color: #6f9f9b; }
  .kub { color: #d9c98a; }
  .chips { margin-top: 4px; }
  .chip { display: inline-block; font-size: 10.5px; letter-spacing: 1px; color: #7d7457;
    border: 1px solid #2e2b20; border-radius: 999px; padding: 1px 9px; margin-right: 6px; }
  #bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(680px, 92vw); display: flex; gap: 8px; align-items: center; }
  #typed { flex: 1; background: #101018; border: 1px solid #23232e; border-radius: 10px;
    color: #e8e4d8; padding: 11px 14px; font-size: 14px; outline: none; }
  #typed:focus { border-color: #4a4433; }
  label.cf { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8a815f;
    user-select: none; white-space: nowrap; }
  input[type=checkbox] { accent-color: #c9a227; }
  #err { position: fixed; bottom: 4px; width: 100%; text-align: center; font-size: 11px;
    color: #a05c5c; }
</style>
</head>
<body>
<div id="hint">click the face or hold SPACE to talk &nbsp;·&nbsp; type below if you must</div>
<div id="stage">
  <canvas id="orb" width="520" height="520"></canvas>
  <div id="status">idle</div>
</div>
<div id="log"></div>
<div id="bar">
  <input id="typed" placeholder="…or type to KUBERA" autocomplete="off">
  <label class="cf"><input type="checkbox" id="confirm"> confirm this turn</label>
</div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ------------------------------------------------------------------ state
const S = { mode: "idle", conversationId: null, amp: 0, t: 0 };
const COLORS = { idle: [201,162,39], listening: [78,168,160], thinking: [148,108,214],
                 speaking: [222,186,80] };
const statusEl = document.getElementById("status");
const errEl = document.getElementById("err");
function setMode(m) { S.mode = m; statusEl.textContent = m; }

// ------------------------------------------------------------------ face v3 (T097)
// HOLOGRAPHIC head, tuned offline against the owner's second reference:
// ~23k GPU points in stacked voxel columns (3 depth layers for volume),
// speckled ice/navy palette, dark eye hollows with glowing tracking pupils,
// scan-line sweep + flicker + occasional glitch, and below the jaw the head
// dissolves into a slowly undulating wireframe network cascade. The head
// follows the cursor (frontal rest pose per the reference), pupils lead,
// lips ride the TTS amplitude, thinking shimmers.
// Falls back to a simple pulse if three.js can't load — voice always works.
const canvas = document.getElementById("orb");
let mx = innerWidth / 2, my = innerHeight / 2, lastMove = 0;
addEventListener("mousemove", (e) => { mx = e.clientX; my = e.clientY; lastMove = S.t; });

// --- the sculpt (constants tuned via offline renders; y grows DOWN like the tuning rig)
function G(x, y, x0, y0, sx, sy, amp) {
  return amp * Math.exp(-(((x - x0) ** 2) / (2 * sx * sx) + ((y - y0) ** 2) / (2 * sy * sy)));
}
function faceWidth(y) {
  let cr = 0;
  const a = (y + 20) / 75;
  if (Math.abs(a) <= 1) cr = 68 * (1 - a * a) ** 0.42;
  let jaw = 0;
  if (y >= -20 && y <= 80) {
    const t = Math.max(0, (y - 20) / 60);
    jaw = 62 - 42 * t ** 1.35;
    if (y > 70) jaw *= Math.sqrt(Math.max(0, 1 - ((y - 70) / 18) ** 2));
  }
  if (y < 10) return cr;
  if (y > 34) return jaw;
  const tt = (y - 10) / 24;
  return cr * (1 - tt) + jaw * tt;
}
function faceDepth(x, y) {
  const w = faceWidth(y);
  if (w <= 2 || Math.abs(x) > w) return null;
  let z = 60 * Math.sqrt(Math.max(0, 1 - (x / 74) ** 2 - ((y + 6) / 102) ** 2));
  const ax = Math.abs(x);
  z += G(ax, y, 26, -32, 30, 8, 4);            // brow ridge
  z += G(ax, y, 26, -18, 13, 8.5, -11);        // eye sockets
  z += G(ax, y, 26, -17, 6.5, 4.0, 6);         // eyeballs
  z += G(x, y, 0, -30, 22, 26, 3);             // forehead
  const ramp = 1 / (1 + Math.exp(-(y + 24) / 6));
  const fall = 1 / (1 + Math.exp((y - 26) / 3));
  z += 15 * Math.exp(-(x * x) / 98) * ramp * fall;  // nose bridge
  z += G(x, y, 0, 24, 8.5, 6.5, 9);            // nose tip
  z += G(ax, y, 11, 29, 5, 4, 5);              // nostril wings
  z += G(ax, y, 6.5, 31, 3.4, 2.6, -4);        // nostrils
  z += G(x, y, 0, 44, 15, 4.2, 7);             // upper lip
  z += G(x, y, 0, 53, 13, 4.6, 7.5);           // lower lip
  z += G(x, y, 0, 48.5, 14, 1.7, -6);          // mouth line
  z += G(x, y, 0, 70, 13, 10, 7);              // chin
  z += G(ax, y, 40, 6, 14, 13, 5);             // cheekbones
  z += G(ax, y, 30, 30, 12, 12, -3);           // cheek hollow
  z += G(ax, y, 54, -38, 12, 15, -4);          // temples
  const edge = Math.min(1, (w - ax) / 10);
  return z * (0.35 + 0.65 * edge);
}

if (typeof THREE !== "undefined") initFace3D(); else initFaceFallback();

function initFace3D() {
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(520, 520, false);
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  // head (y +95..-86) + network cascade (down to -253): frame the whole column
  const camera = new THREE.PerspectiveCamera(55, 1, 10, 2000);
  camera.position.set(0, -75, 330);
  camera.lookAt(0, -75, 0);
  const head = new THREE.Group();
  scene.add(head);

  // build attributes: 3 stacked depth layers per surface sample (volumetric
  // voxel-column look), speckled palette class, per-column brightness stripe.
  // kind: 0 skin / 1 eye hollow / 2 pupil / 3 mouth
  const P = [], SH = [], K = [], SD = [], PAL = [];
  const XSTEP = 2.2, YSTEP = 1.1, EPS = 1.2;
  const LAYER_Z = [0, -2.2, -4.4], LAYER_S = [1.0, 0.55, 0.32];
  for (let y = -95; y <= 86; y += YSTEP) {
    for (let x = -75; x <= 75; x += XSTEP) {
      const z = faceDepth(x, y);
      if (z === null) continue;
      const zx1 = faceDepth(x + EPS, y), zx0 = faceDepth(x - EPS, y);
      const zy1 = faceDepth(x, y + EPS), zy0 = faceDepth(x, y - EPS);
      let s;
      if (zx1 === null || zx0 === null || zy1 === null || zy0 === null) s = 0.75;
      else {
        const gx = (zx1 - zx0) / (2 * EPS), gy = (zy1 - zy0) / (2 * EPS);
        const n = Math.sqrt(gx * gx + gy * gy + 1);
        s = Math.max(0, (-gx / n) * -0.3 + (-gy / n) * -0.45 + (1 / n) * 0.85);
      }
      s = 0.22 + 0.78 * s;
      const colHash = Math.abs(Math.sin(Math.round(x / XSTEP) * 12.9898) * 43758.5453) % 1;
      s *= 0.72 + 0.5 * colHash;                 // vertical column striping
      const eye = Math.min(Math.hypot(x - 26, y + 17), Math.hypot(x + 26, y + 17));
      let k = 0;
      if (eye < 2.8) k = 2;
      else if (eye < 10) { k = 1; s *= 0.28; }   // dark hollows, baked
      else if (Math.abs(x) < 20 && y > 40 && y < 58) k = 3;
      // speckled two-tone palette: mostly mid blue, pale ice in lit areas, navy flecks
      const rr = Math.random();
      const pal = rr < 0.16 + 0.30 * Math.max(0, s - 0.45) ? 2
                : (rr > 0.82 || s < 0.30) ? 0 : 1;
      for (let L = 0; L < 3; L++) {
        P.push(x, -y, z - 30 + LAYER_Z[L]);      // three.js y is up
        SH.push(s * LAYER_S[L]); K.push(k); SD.push(Math.random() * 10); PAL.push(pal);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute("aShade", new THREE.Float32BufferAttribute(SH, 1));
  geo.setAttribute("aKind", new THREE.Float32BufferAttribute(K, 1));
  geo.setAttribute("aSeed", new THREE.Float32BufferAttribute(SD, 1));
  geo.setAttribute("aPal", new THREE.Float32BufferAttribute(PAL, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uAmp: { value: 0 }, uMode: { value: 0 },
      uColor: { value: new THREE.Color() }, uGaze: { value: new THREE.Vector2() },
      uPR: { value: renderer.getPixelRatio() },
      uScanY: { value: 200 }, uGlitch: { value: 0 },
    },
    vertexShader: `
      attribute float aShade, aKind, aSeed, aPal;
      uniform float uTime, uAmp, uMode, uPR, uGlitch;
      uniform vec2 uGaze;
      varying float vShade, vKind, vSeed, vPal, vY;
      void main() {
        vec3 p = position;
        p.z += 0.8 * sin(uTime * 7.0 + aSeed * 9.0);          // holo instability
        p.x += uGlitch * (fract(sin(floor(position.y / 3.0) * 7.13) * 371.7) - 0.5) * 14.0;
        if (uMode > 1.5 && uMode < 2.5)                        // thinking shimmer
          p.xy += 1.4 * vec2(sin(uTime * 4.0 + aSeed * 5.0), cos(uTime * 3.4 + aSeed * 4.0));
        if (aKind > 1.5 && aKind < 2.5) p.xy += uGaze * 6.0;   // pupils lead
        if (aKind > 2.5 && uMode > 2.5)                        // lips ride the audio
          p.y += sin(uTime * 26.0 + position.x * 0.35) * uAmp * 6.0;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = uPR * (2.3 + aShade * 1.3) * (300.0 / -mv.z);
        vShade = aShade; vKind = aKind; vSeed = aSeed; vPal = aPal; vY = position.y;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uAmp, uTime, uScanY;
      varying float vShade, vKind, vSeed, vPal, vY;
      void main() {
        float jit = 0.85 + 0.30 * fract(sin(vSeed * 91.7) * 43758.5);
        float s = vShade * jit * (1.0 + uAmp * 0.5);
        vec3 base = vec3(0.30, 0.45, 0.72);                    // mid blue
        if (vPal < 0.5) base = vec3(0.10, 0.16, 0.36);         // navy fleck
        else if (vPal > 1.5) base = vec3(0.80, 0.88, 1.00);    // ice
        vec3 col = mix(base * s, uColor * s, 0.35);
        col += exp(-pow(vY - uScanY, 2.0) / 220.0) * 0.25 * uColor;  // scan sweep
        col *= 0.95 + 0.05 * sin(uTime * 13.7 + vSeed);        // holo flicker
        if (vKind > 1.5 && vKind < 2.5) col = mix(uColor, vec3(1.0), 0.55) * 1.6;  // pupil
        if (vKind > 2.5) col *= 1.0 + uAmp * 0.8;              // lips
        gl_FragColor = vec4(col, 0.9);
      }`,
  });
  head.add(new THREE.Points(geo, mat));

  // the cascade: a wireframe network the head dissolves into below the jaw
  const NODES = 230, MAXSEG = 900, LINK2 = 34 * 34;
  const nodes = [];
  for (let i = 0; i < NODES; i++) {
    const t = Math.random();
    const spread = 52 + 48 * Math.sin(Math.min(1, t) * Math.PI * 0.85);
    nodes.push({
      bx: (Math.random() * 2 - 1) * spread,
      by: -(78 + t * 175) + (Math.random() * 16 - 8),
      bz: (Math.random() * 2 - 1) * 40,
      ph: Math.random() * 6.28,
      x: 0, y: 0, z: 0,
    });
  }
  const beard = new THREE.Group();
  scene.add(beard);
  const nodeGeo = new THREE.BufferGeometry();
  nodeGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(NODES * 3), 3));
  const nodeMat = new THREE.PointsMaterial({ size: 3.0, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false });
  beard.add(new THREE.Points(nodeGeo, nodeMat));
  const segGeo = new THREE.BufferGeometry();
  segGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(MAXSEG * 6), 3));
  const segMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.18,
    blending: THREE.AdditiveBlending, depthWrite: false });
  beard.add(new THREE.LineSegments(segGeo, segMat));

  const MODE_N = { idle: 0, listening: 1, thinking: 2, speaking: 3 };
  let yaw = 0, pitch = 0, glitch = 0;
  (function animate() {
    S.t += 0.016;
    const [r, g, b] = COLORS[S.mode] || COLORS.idle;
    mat.uniforms.uColor.value.setRGB(r / 255, g / 255, b / 255);
    nodeMat.color.setRGB(r / 255, g / 255, b / 255);
    segMat.color.setRGB(r / 255, g / 255, b / 255);
    mat.uniforms.uTime.value = S.t;
    mat.uniforms.uAmp.value = S.amp;
    mat.uniforms.uMode.value = MODE_N[S.mode] || 0;
    mat.uniforms.uScanY.value = 100 - ((S.t * 45) % 320);      // sweeping scan band
    if (Math.random() < 0.004) glitch = 1;                     // rare holo glitch
    glitch *= 0.86;
    mat.uniforms.uGlitch.value = glitch;

    // gaze: cursor when fresh; frontal rest pose (per reference) when idle
    const idleGaze = S.t - lastMove > 4;
    const ty = idleGaze ? 0.10 * Math.sin(S.t * 0.3)
                        : Math.max(-0.7, Math.min(0.7, (mx / innerWidth - 0.5) * 1.3));
    const tp = idleGaze ? 0.05 * Math.sin(S.t * 0.23)
                        : Math.max(-0.4, Math.min(0.4, (my / innerHeight - 0.5) * 0.8));
    yaw += (ty - yaw) * 0.07; pitch += (tp - pitch) * 0.07;
    head.rotation.y = yaw;
    head.rotation.x = -pitch;
    beard.rotation.y = yaw * 0.35;                             // sways, not rigid
    mat.uniforms.uGaze.value.set((ty - yaw) * 3 + yaw * 0.5, -(pitch * 0.6));
    head.scale.setScalar(1 + 0.012 * Math.sin(S.t * (S.mode === "thinking" ? 3.6 : 1.4))
                           + S.amp * 0.015);

    // cascade update: slow undulation around anchored base positions
    const np = nodeGeo.attributes.position.array;
    const sp = segGeo.attributes.position.array;
    let seg = 0;
    for (let i = 0; i < NODES; i++) {
      const n = nodes[i];
      n.x = n.bx + 6 * Math.sin(S.t * 0.50 + n.ph);
      n.y = n.by + 4 * Math.sin(S.t * 0.40 + n.ph * 2);
      n.z = n.bz + 6 * Math.cos(S.t * 0.45 + n.ph);
      np[i * 3] = n.x; np[i * 3 + 1] = n.y; np[i * 3 + 2] = n.z;
    }
    for (let i = 0; i < NODES && seg < MAXSEG; i++) {
      const n = nodes[i];
      for (let j = i + 1; j < NODES && seg < MAXSEG; j++) {
        const m = nodes[j];
        const dx = n.x - m.x, dy = n.y - m.y, dz = n.z - m.z;
        if (dx * dx + dy * dy + dz * dz < LINK2) {
          sp[seg * 6] = n.x; sp[seg * 6 + 1] = n.y; sp[seg * 6 + 2] = n.z;
          sp[seg * 6 + 3] = m.x; sp[seg * 6 + 4] = m.y; sp[seg * 6 + 5] = m.z;
          seg++;
        }
      }
    }
    nodeGeo.attributes.position.needsUpdate = true;
    segGeo.attributes.position.needsUpdate = true;
    segGeo.setDrawRange(0, seg * 2);

    S.amp *= 0.92; // decay toward calm
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  })();
}

function initFaceFallback() {
  // three.js unreachable (offline?): a minimal pulse so state is still visible.
  const ctx = canvas.getContext("2d");
  errEl.textContent = "face needs internet once (three.js CDN) — voice still works";
  (function pulse() {
    S.t += 0.016;
    ctx.clearRect(0, 0, 520, 520);
    const [r, g, b] = COLORS[S.mode] || COLORS.idle;
    const rad = 90 * (1 + 0.04 * Math.sin(S.t * 1.6)) * (1 + S.amp * 0.5);
    const glow = ctx.createRadialGradient(260, 260, 10, 260, 260, rad * 2);
    glow.addColorStop(0, `rgba(${r},${g},${b},0.8)`);
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(260, 260, rad * 2, 0, 7); ctx.fill();
    S.amp *= 0.92;
    requestAnimationFrame(pulse);
  })();
}

// ------------------------------------------------------------------ log
const logEl = document.getElementById("log");
function addTurn(who, text, chips) {
  const div = document.createElement("div");
  div.className = "turn";
  div.innerHTML = `<span class="${who === "you" ? "you" : "kub"}">${
    who === "you" ? "you" : "kubera"}</span> — ${text.replace(/</g, "&lt;")}` +
    (chips && chips.length
      ? `<div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>`
      : "");
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// ------------------------------------------------------------------ speech in
// Patience (owner feedback 2026-08-14): a thinking pause is NOT the end of your
// sentence. The mic stays open across pauses; your words only send after
// SILENCE_SEND_MS of true quiet — or immediately when you click the orb again.
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const SILENCE_SEND_MS = 2800;
let rec = null, silenceTimer = null, finalBuf = "", lastInterim = "", wantListening = false;

function armSilenceTimer() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(finishListening, SILENCE_SEND_MS);
}
function finishListening() {
  clearTimeout(silenceTimer);
  wantListening = false;
  if (rec) { rec.onend = null; try { rec.stop(); } catch (_) {} }
  const text = (finalBuf + " " + lastInterim).trim();
  finalBuf = ""; lastInterim = "";
  if (text) send(text); else setMode("idle");
}
function startListening() {
  if (S.mode !== "idle") return;
  if (!Rec) { errEl.textContent = "Speech recognition needs Chrome or Edge — typing still works."; return; }
  rec = new Rec();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
  wantListening = true; finalBuf = ""; lastInterim = "";
  setMode("listening");
  statusEl.textContent = "listening — pauses are fine; click the orb to send now";
  rec.onresult = (e) => {
    S.amp = Math.min(1, S.amp + 0.25);
    lastInterim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalBuf += r[0].transcript + " ";
      else lastInterim = r[0].transcript;
    }
    armSilenceTimer();  // every sound resets the clock — send only on real quiet
    statusEl.textContent = "listening — " + (finalBuf + lastInterim).slice(-42);
  };
  rec.onerror = (e) => {
    if (e.error === "no-speech" || e.error === "aborted") return;  // quiet restarts are normal
    errEl.textContent = "mic: " + e.error; wantListening = false; setMode("idle");
  };
  rec.onend = () => {  // the engine restarts itself on silence — keep the mic open
    if (wantListening) { try { rec.start(); } catch (_) {} }
  };
  rec.start();
}
function stopListening() { if (S.mode === "listening") finishListening(); }

canvas.addEventListener("click", () =>
  S.mode === "listening" ? stopListening() : startListening());
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && document.activeElement !== typedEl) { e.preventDefault(); startListening(); }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space" && document.activeElement !== typedEl) { e.preventDefault(); stopListening(); }
});

// ------------------------------------------------------------------ chat + voice out
const typedEl = document.getElementById("typed");
const confirmEl = document.getElementById("confirm");
typedEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && typedEl.value.trim()) { send(typedEl.value.trim()); typedEl.value = ""; }
});

let audioCtx = null, analyser = null;
function trackAmplitude(audio) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser); analyser.connect(audioCtx.destination);
    const data = new Uint8Array(analyser.frequencyBinCount);
    (function pump() {
      if (S.mode !== "speaking") return;
      analyser.getByteFrequencyData(data);
      S.amp = Math.min(1, data.reduce((a, v) => a + v, 0) / data.length / 90);
      requestAnimationFrame(pump);
    })();
  } catch (_) { /* amplitude is decoration; never break speech */ }
}

async function send(text) {
  errEl.textContent = "";
  addTurn("you", text);
  setMode("thinking");
  const confirm = confirmEl.checked;
  confirmEl.checked = false; // one deliberate turn at a time
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, conversation_id: S.conversationId,
                             voice: true, confirm })
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const body = await r.json();
    S.conversationId = body.conversation_id;
    addTurn("kubera", body.reply, (body.tool_calls || []).map(t => t.name));
    setMode("speaking");
    const audio = new Audio("/api/tts?text=" + encodeURIComponent(body.reply.slice(0, 2000)));
    audio.crossOrigin = "anonymous";
    audio.onended = () => setMode("idle");
    audio.onerror = () => { errEl.textContent = "voice unavailable (is edge-tts installed in the server venv?) — reply shown above"; setMode("idle"); };
    trackAmplitude(audio);
    await audio.play();
  } catch (e) {
    errEl.textContent = String(e.message || e);
    setMode("idle");
  }
}
</script>
</body>
</html>
