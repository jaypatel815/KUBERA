# Pyrefly config — makes the IDE agree with how KUBERA actually runs.
#
# Without this, the editor reports ~140 errors in a repo whose test suite is
# fully green, and an agent (or the owner) learns to ignore the squiggles. A
# type checker that cries wolf is worse than no type checker: the one real
# finding gets filed away with the noise. The whole point of this file is to
# make a red mark mean something again.
#
# Migrated from pyrightconfig.json (kept, so pyright users are unaffected) and
# then corrected in two places the migration could not know about:
#
#   1. search-path also needs `backend/tests`. The suite imports shared fixtures
#      between test modules (`from test_alpaca import paper_settings`), which
#      works at runtime because pytest puts the test directory on sys.path and
#      backend/tests/conftest.py adds `backend/` itself. Static analysis has no
#      pytest, so it must be told. This alone was 56 of the errors.
#   2. The `[errors]` section below suppresses three CATEGORIES that are false
#      by construction here, each with the reason written down. Everything else
#      stays on — including missing-import, which is how the one genuine bug in
#      this sweep (I017) surfaced.

project-includes = ["backend", "scripts"]

project-excludes = [
    "**/__pycache__",
    ".venv",
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    "backend/alembic/versions",  # autogenerated; we sed them, we don't type them
    "src",                       # stray `uv init` scaffold, not part of the app
]

# Mirrors backend/tests/conftest.py + pytest's rootdir insertion.
search-path = ["backend", "backend/tests"]

# Matches .python-version (3.14.7) — D025. A checker set to an older version
# silently permits syntax the runtime accepts and misses nothing useful in
# return; one that is NEWER than the runtime flags valid code. Keep it equal.
python-version = "3.14.7"

# Optional runtime dependencies, every one of them imported lazily inside a
# try/except ImportError with an actionable install message. They are ABSENT on
# purpose — that is the design (T070/I016: audio deps stay out of CI) — so a
# checker complaining that it cannot find them is reporting the intended state
# of the world as a defect. Treated as Any; real missing imports still error.
replace-imports-with-any = [
    "sounddevice",       # voice loop audio I/O        (requirements-voice.txt)
    "faster_whisper",    # local speech-to-text        (requirements-voice.txt)
    "pyttsx3",           # sapi fallback voice         (requirements-voice.txt)
    "edge_tts",          # online neural voice         (optional, D024 fallback)
    "kokoro_onnx",       # LOCAL neural voice          (optional, D024 preferred)
    "openai",            # only for KUBERA_TTS=openai  (optional)
    "claude_agent_sdk",  # the Max-subscription brain  (optional, T046)
]

infer-with-first-use = false

[errors]
# Real missing imports must stay loud — a typo in a module name should fail here
# before it fails in CI.
missing-import = "error"

# pydantic-settings: KuberaSettings takes **kwargs of many types, and every test
# that builds one with keyword overrides trips this. The runtime validates the
# values properly; the checker is inferring `bool | str | Unknown` from the
# BaseSettings signature and cannot see pydantic's coercion.
bad-argument-type = "warn"

# Tests get a looser dial than production code, and only for the three kinds
# below. Reason: the suite deliberately asserts on Optional fields AFTER setting
# up the exact conditions that populate them —
#     assert report.worst["slippage_bps"] == pytest.approx(20.0)
# where `worst` is `dict | None`. A checker cannot narrow that from a fixture,
# so it reports 40-odd of them. Adding `assert x is not None` before every one
# would be noise written to please a tool.
# These stay ERRORS in backend/api, backend/analysis, backend/risk, backend/data
# and backend/backtest, which is where an unguarded None actually costs money.
[[sub-config]]
matches = "backend/tests/**"

[sub-config.errors]
unsupported-operation = "warn"
missing-attribute = "warn"
not-iterable = "warn"

# ---------------------------------------------------------------------------
# KNOWN REMAINING ERRORS — 6, as of 2026-08-16, every one triaged and none a bug.
# Left visible ON PURPOSE rather than suppressed: six understood marks you can
# hold in your head is a working signal; zero marks bought with a blanket
# suppression is a checker you have quietly switched off. If this list grows,
# something new arrived and deserves a look.
#
#   analysis/correlation.py:152  `best["corr"] >= HIGH_CORR`
#       `best` is {"with": str, "corr": float}, so the value type infers as
#       `str | float`. Runtime is always float. Real fix is a TypedDict (T101).
#   analysis/ranking.py:105      `sum(pcts)`
#       The comprehension one line above filters `is not None`; the checker
#       cannot narrow list elements through that filter. Runtime-safe.
#   backtest/strategies.py x3    `regime_router.last_leg = ...`
#       Attaching state to a function object for T091 introspection. Legal
#       Python, unmodelled by any checker. Would be cleaner as a class (T101).
#   data/fred.py:61              `s.fred_api_key.get_secret_value()`
#       `require_fred()` raises ConfigError when the key is absent and then
#       returns self, so it is non-None here — but the return type still says
#       `SecretStr | None`. A TypeGuard would express it (T101).
#
# The sweep that produced this list also found one GENUINE bug on its first
# run: estimate_risk_tolerance referenced AccountSnapshot.captured_at, a column
# that does not exist. Every test passed because none of them executed the
# tool. That single catch paid for this file.
