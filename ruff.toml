line-length = 100
# Matches .python-version (3.14.7), the single source of truth. Ruff needs the
# major.minor form. Keep this in step with .python-version — D025.
target-version = "py314"

[lint]
select = ["E", "F", "I", "W"]

[lint.isort]
known-first-party = ["analysis", "api", "backtest", "data", "research_agent", "risk", "settings"]

[lint.per-file-ignores]
# Alembic autogenerates these; keep F-rules (real bugs) but skip style nits.
"backend/alembic/versions/*" = ["E501", "W291", "I001"]
